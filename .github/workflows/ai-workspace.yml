name: AI Workspace

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Hermes Agent"
        required: true
        type: string
      model:
        description: "FreeLLMAPI model (auto or exact model ID)"
        required: false
        default: "auto"
        type: string

permissions:
  contents: read

concurrency:
  group: ai-workspace
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Start FreeLLMAPI
        env:
          FREEAPI_CONFIG_JSON: ${{ secrets.FREEAPI_CONFIG_JSON }}
          ENCRYPTION_KEY: ${{ secrets.FREEAPI_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FREEAPI_CONFIG_JSON}" ] || [ -z "${ENCRYPTION_KEY}" ]; then
            echo "::error::Missing FREEAPI_CONFIG_JSON or FREEAPI_ENCRYPTION_KEY repository secret. See SETUP.md."
            exit 1
          fi
          docker run -d --name freellmapi \
            -p 127.0.0.1:3001:3001 \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e ENCRYPTION_KEY="${ENCRYPTION_KEY}" \
            -e FREEAPI_CONFIG_JSON="${FREEAPI_CONFIG_JSON}" \
            -v "${RUNNER_TEMP}/freeapi-data:/app/server/data" \
            ghcr.io/tashfeenahmed/freellmapi:latest

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/ping >/dev/null; then
              echo "FreeLLMAPI is healthy."
              exit 0
            fi
            sleep 2
          done
          docker logs freellmapi
          echo "::error::FreeLLMAPI did not become healthy."
          exit 1

      - name: Install Hermes Agent
        run: |
          set -euo pipefail
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o /tmp/install-hermes.sh
          bash /tmp/install-hermes.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.hermes/bin" >> "$GITHUB_PATH"

      - name: Configure Hermes and run task
        env:
          FREELLMAPI_UNIFIED_KEY: ${{ secrets.FREELLMAPI_UNIFIED_KEY }}
          HERMES_TASK: ${{ inputs.task }}
          HERMES_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          if [ -z "${FREELLMAPI_UNIFIED_KEY}" ]; then
            echo "::error::Missing FREELLMAPI_UNIFIED_KEY repository secret. See SETUP.md."
            exit 1
          fi
          mkdir -p "$HOME/.hermes" output
          cat > "$HOME/.hermes/config.yaml" <<'YAML'
          model:
            default: auto
            provider: custom
            base_url: http://127.0.0.1:3001/v1
            api_key: ${FREELLMAPI_UNIFIED_KEY}
          YAML
          printf 'FREELLMAPI_UNIFIED_KEY=%s\n' "$FREELLMAPI_UNIFIED_KEY" > "$HOME/.hermes/.env"
          chmod 600 "$HOME/.hermes/.env"

          # Select the requested router model for this run.
          if [ -n "${HERMES_MODEL}" ] && [ "${HERMES_MODEL}" != "auto" ]; then
            sed -i "s/default: auto/default: ${HERMES_MODEL}/" "$HOME/.hermes/config.yaml"
          fi

          hermes doctor
          set -o pipefail
          hermes chat -q "$HERMES_TASK" 2>&1 | tee output/hermes-run.log

      - name: Upload task output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-task-output
          path: output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop FreeLLMAPI
        if: always()
        run: docker rm -f freellmapi >/dev/null 2>&1 || true
